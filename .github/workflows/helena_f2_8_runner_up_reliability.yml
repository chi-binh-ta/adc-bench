name: Helena F2.8 runner-up reliability identification

on:
  workflow_dispatch:
  push:
    branches: [helena-reconstruction-clone-20260909]
    paths:
      - 'helena_clone/F2_8_TRIGGER'

jobs:
  identify:
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: 2
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      NUMEXPR_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: helena-reconstruction-clone-20260909
      - name: Install scientific stack
        run: pip install -q numpy pandas scipy scikit-learn
      - name: Download canonical final seed logits
        uses: actions/download-artifact@v4
        with:
          pattern: helena-final-seed-*
          path: helena_clone/f2_8_artifacts
          merge-multiple: true
          repository: chi-binh-ta/adc-bench
          run-id: 34375185211
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run F2.8 runner-up reliability identification
        run: cd helena_clone && python run_f2_8_runner_up_reliability.py --artifact-dir f2_8_artifacts
      - name: Upload F2.8 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helena-f2-8-runner-up-reliability
          path: |
            helena_clone/outputs/F2_8_RUNNER_UP_RELIABILITY.json
            helena_clone/outputs/f2_8_cal_decision.json
            helena_clone/outputs/f2_8_oof_metrics.csv
            helena_clone/outputs/f2_8_group_attribution.csv
            helena_clone/outputs/f2_8_fold_diagnostics.csv
            helena_clone/outputs/f2_8_oof_features.csv
            helena_clone/outputs/f2_8_oof_predictions.csv
            helena_clone/outputs/f2_8_test_metrics.csv
            helena_clone/outputs/f2_8_test_predictions.csv
            helena_clone/outputs/f2_8_bootstrap.json
            helena_clone/F2_8_RUNNER_UP_RELIABILITY_PROTOCOL.md
          retention-days: 30
          if-no-files-found: warn
