name: Helena F2.11 terminal adaptive-prefix intervention

on:
  workflow_dispatch:
  push:
    branches: [helena-reconstruction-clone-20260909]
    paths:
      - 'helena_clone/F2_11_TRIGGER'

jobs:
  terminal:
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: 2
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      NUMEXPR_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: helena-reconstruction-clone-20260909
      - name: Install scientific stack
        run: pip install -q numpy pandas scipy scikit-learn
      - name: Download canonical final seed logits
        uses: actions/download-artifact@v4
        with:
          pattern: helena-final-seed-*
          path: helena_clone/f2_11_artifacts
          merge-multiple: true
          repository: chi-binh-ta/adc-bench
          run-id: 34375185211
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run F2.11 terminal adaptive-prefix intervention
        run: cd helena_clone && python run_f2_11_terminal_adaptive_prefix.py --artifact-dir f2_11_artifacts
      - name: Upload F2.11 terminal audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helena-f2-11-terminal-adaptive-prefix
          path: |
            helena_clone/outputs/F2_11_TERMINAL_ADAPTIVE_PREFIX.json
            helena_clone/outputs/f2_11_cal_decision.json
            helena_clone/outputs/f2_11_metrics.csv
            helena_clone/outputs/f2_11_inner_selection_grid.csv
            helena_clone/outputs/f2_11_global_oof_grid.csv
            helena_clone/outputs/f2_11_outer_fold_selections.csv
            helena_clone/outputs/f2_11_prefix_assignments.csv
            helena_clone/outputs/f2_11_oof_features.csv
            helena_clone/F2_11_TERMINAL_ADAPTIVE_PREFIX_PROTOCOL.md
          retention-days: 30
          if-no-files-found: warn
