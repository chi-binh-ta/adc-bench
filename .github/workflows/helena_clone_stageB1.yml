name: Helena reconstructed clone StageB1 seed42
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stageB1:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: 2
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      NUMEXPR_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: helena-reconstruction-clone-20260909
      - name: Install scientific stack
        run: pip install -q numpy pandas scipy scikit-learn
      - name: Run reconstructed clone B1
        run: python helena_clone/run_stageB1_clone.py
      - name: Upload B1 provenance and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helena-clone-stageB1-seed42-m16384
          path: |
            helena_clone/outputs/**
            helena_clone/RECONSTRUCTION_MANIFEST.md
            helena_clone/HISTORICAL_LEDGER.md
            helena_clone/config_stageB1.json
          retention-days: 30
