name: Helena canonical final rerun

on:
  push:
    branches:
      - helena-reconstruction-clone-20260909
    paths:
      - helena_clone/FINAL_RERUN_TRIGGER.txt
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  train_seed:
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 123, 456, 789, 2026]
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: 2
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      NUMEXPR_NUM_THREADS: 2
      STAGE_D_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: helena-reconstruction-clone-20260909
      - name: Install scientific stack
        run: pip install -q numpy pandas scipy scikit-learn
      - name: Retrain frozen Helena seed from raw data
        run: |
          rm -rf helena_clone/cache helena_clone/outputs
          mkdir -p helena_clone/cache helena_clone/outputs
          cd helena_clone
          python run_stageD_seed.py
      - name: Upload fresh seed logits and audit
        uses: actions/upload-artifact@v4
        with:
          name: helena-final-seed-${{ matrix.seed }}
          path: |
            helena_clone/outputs/stageD_seed${{ matrix.seed }}_predictions.npz
            helena_clone/outputs/stageD_seed${{ matrix.seed }}_summary.json
            helena_clone/outputs/stageD_seed${{ matrix.seed }}_training.json
            helena_clone/outputs/rsp_fingerprint_seed${{ matrix.seed }}_m16384.json
          retention-days: 30

  aggregate_final:
    needs: train_seed
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: 2
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      NUMEXPR_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: helena-reconstruction-clone-20260909
      - name: Install scientific stack
        run: pip install -q numpy pandas scipy scikit-learn
      - name: Download fresh final-rerun seed artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: helena-final-seed-*
          path: helena_clone/final_rerun_artifacts
          merge-multiple: true
      - name: Aggregate frozen ensemble and fit global G2 on CAL
        run: |
          cd helena_clone
          python aggregate_helena_final_rerun.py --artifact-dir final_rerun_artifacts
      - name: Upload canonical final rerun result
        uses: actions/upload-artifact@v4
        with:
          name: helena-canonical-final-rerun
          path: |
            helena_clone/outputs/HELENA_FINAL_RERUN.md
            helena_clone/outputs/helena_final_rerun_metrics.csv
            helena_clone/outputs/helena_final_rerun_summary.json
            helena_clone/HELENA_FINAL_RERUN_PROTOCOL.md
          retention-days: 30
