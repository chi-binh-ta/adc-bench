name: Smoke Test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect project directory
        id: project
        shell: bash
        run: |
          if [ -f "requirements.txt" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "adc-bench/requirements.txt" ]; then
            echo "dir=adc-bench" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find requirements.txt"
            exit 1
          fi

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: List benchmark tasks
        working-directory: ${{ steps.project.outputs.dir }}
        run: python -m adc_bench.cli list

      - name: Run baseline agent
        working-directory: ${{ steps.project.outputs.dir }}
        run: python examples/run_baseline.py

      - name: Verify sample two_sum_hash submission
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          python -m adc_bench.cli verify --task tasks/known/two_sum_hash --submission examples/sample_submissions/two_sum_hash --timeout 5 --format json | tee verifier_result.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("verifier_result.json").read_text(encoding="utf-8-sig"))

          assert result["passed_public"] is True, result
          assert result["passed_hidden"] is True, result
          assert result["passed_stress"] is True, result
          assert result["correctness"] == 1.0, result
          assert result["complexity"] == 1.0, result
          assert result["anti_cheat"] == 1.0, result
          assert result["trace_quality"] >= 0.7, result

          print("Verifier smoke test passed.")
          PY

      - name: Evaluate sample self-improvement agent
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          python -m adc_bench.cli self-improve-eval --baseline-agent agents/agent_v0 --candidate-agent examples/sample_self_improve --task self_improvement/tasks/basic_agent_upgrade --timeout 5 --format json | tee self_improve_result.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("self_improve_result.json").read_text(encoding="utf-8-sig"))

          assert result["split_is_disjoint"] is True, result
          assert result["split_overlap_tasks"] == [], result
          assert result["heldout_task_count"] >= 1, result
          assert result["candidate_average_score"] >= result["baseline_average_score"], result
          assert result["self_improve_score"] > 0, result
          assert result["anti_cheat"] == 1.0, result

          print("Self-improvement smoke test passed.")
          PY
