name: Helena Stage F0 latent residual audit

on:
  push:
    branches: [helena-reconstruction-clone-20260909]
    paths:
      - 'helena_clone/STAGE_F0_LAUNCH.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stageF0:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: 2
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      NUMEXPR_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: helena-reconstruction-clone-20260909
      - name: Install scientific stack
        run: pip install -q numpy pandas scipy scikit-learn
      - name: Download fresh canonical rerun seed logits
        uses: actions/download-artifact@v4
        with:
          pattern: helena-final-seed-*
          path: helena_clone/stageF0_artifacts
          merge-multiple: true
          repository: chi-binh-ta/adc-bench
          run-id: 34375185211
          github-token: ${{ github.token }}
      - name: Run frozen Stage F0 audit
        run: |
          cd helena_clone
          python run_stageF0_latent_audit.py --artifact-dir stageF0_artifacts
      - name: Upload Stage F0 evidence
        uses: actions/upload-artifact@v4
        with:
          name: helena-stageF0-latent-residual-audit
          path: |
            helena_clone/outputs/STAGE_F0_RESULT.md
            helena_clone/outputs/stageF0_summary.json
            helena_clone/outputs/stageF0_residual_spectrum.csv
            helena_clone/outputs/stageF0_rank_tests.csv
            helena_clone/outputs/stageF0_seed_spectral_summary.csv
            helena_clone/outputs/stageF0_seed_pairwise_overlap.csv
            helena_clone/STAGE_F0_LATENT_AUDIT.md
          retention-days: 30
