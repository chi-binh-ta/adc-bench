name: Helena F1 latent factor identification v2

on:
  push:
    branches: [helena-reconstruction-clone-20260909]
    paths:
      - 'helena_clone/run_latent_factor_identification_v2.py'
      - '.github/workflows/helena_latent_factor_identification_v2.yml'
  workflow_dispatch:

jobs:
  identify:
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: 2
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      NUMEXPR_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: helena-reconstruction-clone-20260909
      - name: Install scientific stack
        run: pip install -q numpy pandas scipy scikit-learn
      - name: Download canonical final seed logits
        uses: actions/download-artifact@v4
        with:
          pattern: helena-final-seed-*
          path: helena_clone/f1_artifacts
          merge-multiple: true
          repository: chi-binh-ta/adc-bench
          run-id: 34375185211
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run F1 latent factor identification
        run: cd helena_clone && python run_latent_factor_identification_v2.py --artifact-dir f1_artifacts
      - name: Upload F1 audit
        uses: actions/upload-artifact@v4
        with:
          name: helena-f1-latent-factor-identification-v2
          path: |
            helena_clone/outputs/F1_LATENT_FACTOR_IDENTIFICATION.json
            helena_clone/outputs/latent_factor_class_features_cal.csv
            helena_clone/outputs/latent_factor_class_features_test.csv
            helena_clone/outputs/latent_factor_correlations.csv
            helena_clone/outputs/latent_factor_group_models.csv
            helena_clone/outputs/latent_factor_loadings.csv
            helena_clone/outputs/latent_factor_replicated_associations.csv
          retention-days: 30
