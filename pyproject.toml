[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adc-bench"
version = "0.2.0"
description = "Discovery-Transfer-Certification benchmark for algorithmic coding agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pytest>=7.0"
]

[tool.setuptools.packages.find]
include = ["adc_bench*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tasks"]
