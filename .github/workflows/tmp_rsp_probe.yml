name: Temporary RSP protocol probe
on:
  push:
    branches: [tmp-helena-transfer-20260909]
permissions:
  contents: write
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: 2
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-helena-transfer-20260909
      - run: pip install -q numpy pandas scipy scikit-learn
      - run: python tmpdata/probe_rsp_protocol.py
      - name: Commit probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmpout/probe_rsp_protocol.json
          git commit -m 'tmp: RSP spectral probe result' || exit 0
          git push origin HEAD:tmp-helena-transfer-20260909
