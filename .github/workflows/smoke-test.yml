name: Smoke Test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect project directory
        id: project
        shell: bash
        run: |
          if [ -f "requirements.txt" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "adc-bench/requirements.txt" ]; then
            echo "dir=adc-bench" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find requirements.txt"
            exit 1
          fi

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: List benchmark tasks
        working-directory: ${{ steps.project.outputs.dir }}
        run: python -m adc_bench.cli list

      - name: Run baseline agent
        working-directory: ${{ steps.project.outputs.dir }}
        run: python examples/run_baseline.py
