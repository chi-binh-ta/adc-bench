name: Helena F2.10 adaptive protected-prefix identification

on:
  workflow_dispatch:
  push:
    branches: [helena-reconstruction-clone-20260909]
    paths:
      - 'helena_clone/F2_10_TRIGGER'

jobs:
  identify:
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: 2
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      NUMEXPR_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: helena-reconstruction-clone-20260909
      - name: Install scientific stack
        run: pip install -q numpy pandas scipy scikit-learn
      - name: Download canonical final seed logits
        uses: actions/download-artifact@v4
        with:
          pattern: helena-final-seed-*
          path: helena_clone/f2_10_artifacts
          merge-multiple: true
          repository: chi-binh-ta/adc-bench
          run-id: 34375185211
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run F2.10 adaptive protected-prefix identification
        run: cd helena_clone && python run_f2_10_adaptive_protected_prefix.py --artifact-dir f2_10_artifacts
      - name: Upload F2.10 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helena-f2-10-adaptive-protected-prefix
          path: |
            helena_clone/outputs/F2_10_ADAPTIVE_PROTECTED_PREFIX.json
            helena_clone/outputs/f2_10_cal_decision.json
            helena_clone/outputs/f2_10_oof_metrics.csv
            helena_clone/outputs/f2_10_test_metrics.csv
            helena_clone/outputs/f2_10_fold_diagnostics.csv
            helena_clone/outputs/f2_10_oof_features.csv
            helena_clone/outputs/f2_10_oof_predictions.npz
            helena_clone/F2_10_ADAPTIVE_PROTECTED_PREFIX_PROTOCOL.md
          retention-days: 30
          if-no-files-found: warn
