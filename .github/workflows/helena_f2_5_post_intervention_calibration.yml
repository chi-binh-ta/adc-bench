name: Helena F2.5 post-intervention calibration recovery

on:
  workflow_dispatch:
  push:
    branches: [helena-reconstruction-clone-20260909]
    paths:
      - 'helena_clone/F2_5_TRIGGER'

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: 2
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      NUMEXPR_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: helena-reconstruction-clone-20260909
      - name: Install scientific stack
        run: pip install -q numpy pandas scipy scikit-learn
      - name: Download canonical final seed logits
        uses: actions/download-artifact@v4
        with:
          pattern: helena-final-seed-*
          path: helena_clone/f2_5_artifacts
          merge-multiple: true
          repository: chi-binh-ta/adc-bench
          run-id: 34375185211
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run F2.5 post-intervention calibration recovery
        run: cd helena_clone && python run_f2_5_post_intervention_calibration.py --artifact-dir f2_5_artifacts
      - name: Upload F2.5 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helena-f2-5-post-intervention-calibration
          path: |
            helena_clone/outputs/F2_5_POST_INTERVENTION_CALIBRATION.json
            helena_clone/outputs/f2_5_cal_decision.json
            helena_clone/outputs/f2_5_oof_metrics.csv
            helena_clone/outputs/f2_5_fold_diagnostics.csv
            helena_clone/outputs/f2_5_cv_coefficients.csv
            helena_clone/outputs/f2_5_fullcal_coefficients.csv
            helena_clone/outputs/f2_5_test_metrics.csv
            helena_clone/outputs/f2_5_test_bootstrap.json
            helena_clone/F2_5_POST_INTERVENTION_CALIBRATION_PROTOCOL.md
          retention-days: 30
          if-no-files-found: warn
