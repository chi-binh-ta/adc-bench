name: Temporary RSP row-seed 1024 probe
on:
  push:
    branches: [tmp-helena-transfer-20260909]
permissions:
  contents: read
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: 2
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-helena-transfer-20260909
      - run: pip install -q numpy pandas scipy scikit-learn
      - run: python tmpdata/probe_rsp_rowseed1024.py
